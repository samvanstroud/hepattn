[project]
authors = [{name = "Sam Van Stroud", email = "sam.van.stroud@cern.ch"}]
description = "Attention for High Energy Physics"
license = { text = "GPL-3.0-or-later" }
readme = "README.md"
name = "reconstruct-anything"
requires-python = "== 3.12"
version = "0.2.0"

dependencies = [
    "packaging>=24.1,<27",
    "jupyter>=1.1.1,<2",
    "ipykernel>=6.30.1,<7",
    "wheel>=0.45.1,<0.46",
    "numpy>=2.1.2,<3",
    "scipy>=1.16.2,<2",
    "pytest>=8.4.2,<9",
    "pytest-repeat>=0.9.4,<0.10",
    "pytest-cov>=7.0.0,<8",
    "coverage[toml]>=7.10.6,<8",
    "ruff==0.13.0",
    "pre-commit>=4.3.0,<5",
    "matplotlib>=3.10.6,<4",
    "lightning==2.5.2",
    "comet-ml==3.50.0",
    "pandas>=2.3.2,<4",
    "pyarrow>=21.0.0,<24",
    "jsonargparse[signatures]==4.40.1",
    "torchjd>=0.7.0,<0.8",
    "lion-pytorch>=0.2.3,<0.3",
    "awkward>=2.8.8,<3",
    "uproot>=5.6.5,<6",
    "h5py>=3.14.0,<4",
    "particle>=0.25.4,<0.26",
    "scikit-learn>=1.7.2,<2",
    "onnx>=1.19.0,<2",
    "onnxruntime>=1.22.1,<2",
    "einops>=0.8.1,<0.9",
    "atlas-ftag-tools>=0.2.9,<0.3",
    "ty>=0.0.1a20,<0.0.1a21",
    "lapx>=0.9.2,<0.10", "atlasify>=0.8.0,<0.9",
    "py-lap-solver>=0.1.4,<0.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/reconstruct_anything"]


[tool.pixi.workspace]
channels = ["conda-forge", "nvidia", "nodefaults"]
platforms = ["linux-64", "linux-aarch64"]

[tool.pixi.pypi-dependencies]
reconstruct-anything = { path = ".", editable = true }
datasets = ">=4.4.1,<5"
fsspec = { version = ">=2025.10.0,<2027", extras = ["http"] }

# SM7.5+ (A100, GH200): torch with latest CUDA (requires driver >= 13.0)
[tool.pixi.feature.gpu.pypi-dependencies]
torch = { version = "==2.11.0", index = "https://download.pytorch.org/whl/cu130"}

# SM8.9 (L40S): torch with CUDA 12.8 (compatible with 12.4+ drivers)
[tool.pixi.feature.gpu-l40s.pypi-dependencies]
torch = { version = "==2.9.1", index = "https://download.pytorch.org/whl/cu128"}

# SM7.0 (V100): latest torch that supports Volta
[tool.pixi.feature.gpu-volta.pypi-dependencies]
torch = { version = "==2.9.1", index = "https://download.pytorch.org/whl/cu128"}

[tool.pixi.feature.cpu.pypi-dependencies]
torch = { version = "==2.11.0", index = "https://download.pytorch.org/whl/cpu" }

# FA2: SM8.0+ with torch 2.11 + cu130, x86_64 only
[tool.pixi.feature.fa2.pypi-dependencies]
flash-attn = { url = "https://github.com/mjun0812/flash-attention-prebuild-wheels/releases/download/v0.9.4/flash_attn-2.6.3+cu130torch2.11-cp312-cp312-linux_x86_64.whl" }

# FA2 for L40S: torch 2.9 + cu128
[tool.pixi.feature.fa2-l40s.pypi-dependencies]
flash-attn = { url = "https://github.com/mjun0812/flash-attention-prebuild-wheels/releases/download/v0.4.17/flash_attn-2.8.3%2Bcu128torch2.9-cp312-cp312-linux_x86_64.whl" }

# FA3: SM9.0 (GH200) aarch64; SM8.0 (A100) x86_64
[tool.pixi.feature.fa3.target.linux-64.pypi-dependencies]
flash-attn-3 = { url = "https://github.com/windreamer/flash-attention3-wheels/releases/download/2026.03.30-a3a563f/flash_attn_3-3.0.0%2B20260330.cu130torch2110cxx11abitrue.98024f-cp39-abi3-linux_x86_64.whl" }

[tool.pixi.feature.fa3.target.linux-aarch64.pypi-dependencies]
flash-attn-3 = { url = "https://github.com/windreamer/flash-attention3-wheels/releases/download/2026.03.30-a3a563f/flash_attn_3-3.0.0%2B20260330.cu130torch2110cxx11abitrue.98024f-cp39-abi3-linux_aarch64.whl" }

# clic and tide: optional experiment-specific deps
[tool.pixi.feature.clic.pypi-dependencies]
pathos = "*"
vector = "*"
fastjet = "*"
energyflow = "*"

[tool.pixi.feature.tide.pypi-dependencies]
numba = ">=0.61.2"

[tool.pixi.environments]
default     = { features = ["gpu", "fa3"] }        # A100 (SM8.0), x86_64
l40s        = { features = ["gpu-l40s", "fa2-l40s"] }  # L40S (SM8.9), x86_64 - CUDA 12.4+ driver
volta       = { features = ["gpu-volta"] }          # V100 (SM7.0), x86_64 - no flash attention
gracehopper = { features = ["gpu", "fa3"] }        # GH200 (SM9.0), aarch64
cpu         = { features = ["cpu"] }
clic        = { features = ["clic"] }
tide        = { features = ["tide"] }
ci          = { features = ["cpu", "clic", "tide"] }

[tool.pixi.system-requirements]
libc = "2.28"
cuda = "12.8"

[tool.pixi.dependencies]
gxx = ">=14.3.0,<14.4"
git = ">=2.51.0,<3"
git-lfs = ">=3.7.0,<4"
ninja = ">=1.13.1,<2"
cuda = ">=12.8"
openssh = ">=10.2p1,<11"
gh = ">=2.88.1,<3"

[tool.pixi.tasks.test]
cmd = "pytest"

[tool.pixi.tasks.test-ci]
cmd = "pytest -m 'not gpu and not requiresdata' --cov=src --cov-report=xml --cov-report=term-missing"

[tool.pixi.tasks.test-unit-ci]
cmd = "pytest --ignore=tests/experiments/ -m 'not gpu and not requiresdata' --cov=src --cov-report=xml --cov-report=term-missing"

[tool.pixi.tasks.test-integration-ci]
cmd = "pytest tests/experiments/ -m 'not gpu and not requiresdata' --cov=src --cov-report=xml --cov-report=term-missing"


[tool.ruff]
src = ["src"]
line-length = 150
preview = true
#format.skip-magic-trailing-comma = true

[tool.ruff.lint]
select = ["ALL"]
ignore = ["G", "D100", "D101", "D102", "D103",  "D104", "D105", "D106", "D107", "D205", "ANN", "PLW", "FBT", "EM",  "PLR2004", "PT018", "COM812", "CPY001", "TRY003", "S101", "N812", "PLR0913", "PLR0917", "DOC201", "DOC501", "INP001", "PLR6301", "T201", "TD002", "TD003", "FIX002", "ARG002", "C901", "PLR0914", "PLR0912", "PLR0915", "PT011", "ERA001", "PGH004", "PLC0206", "S311", "PLR0911", "PLR6104", "S404", "S603", "B028", "PLR1702", "N806", "N806"]
#isort.split-on-trailing-comma=false
pydocstyle.convention = "google"

[tool.ruff.lint.per-file-ignores]
"*.ipynb" = ["E501"]

[tool.ty.rules]
# ty can't follow **kwargs through super().__init__
missing-argument = "ignore"
invalid-argument-type = "ignore"
unknown-argument = "ignore"


[tool.pytest.ini_options]
filterwarnings = ["ignore:.*distutils Version classes are deprecated. Use packaging.version instead.*:DeprecationWarning"]
markers = ["gpu: mark test to run on GPU", "requiresdata: mark test that requires data not present in the repository"]

[tool.coverage.run]
source = ["src"]
omit = [
    "*/experiments/*",
    "*.ipynb"
]

[tool.coverage.report]
exclude_lines = [
    "raise AssertionError",
    "raise NotImplementedError",
    "raise ValueError",
]
